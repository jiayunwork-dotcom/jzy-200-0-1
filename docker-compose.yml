services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crack
      POSTGRES_PASSWORD: crack
      POSTGRES_DB: crackstation
    ports:
      - "5432:5432"
    volumes:
      - crack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crack -d crackstation"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DRIVER: "postgres"
      DATABASE_DSN: "postgres://crack:crack@db:5432/crackstation?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  crack_pgdata:
